repos:
  - repo: local
    hooks:
      - id: code-lint
        name: code-lint (runs .claude/PAI/Tools/code-lint.ts)
        entry: bash scripts/run-code-lint.sh
        language: script
        stages: [commit]
        description: |
          Run the repository's canonical code-lint helper with autofix enabled
          to provide fast local feedback. This hook invokes the helper with
          `--fix` so it will attempt to auto-correct formatting/lint issues.
        # run for all files (pre-commit will pass changed files implicitly)
